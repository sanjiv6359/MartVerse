<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | MartVerse</title>
    <link rel="stylesheet" href="css/globals.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .auth-layout {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-image: url('https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?ixlib=rb-4.0.3&auto=format&fit=crop&w=2564&q=80');
            background-size: cover;
            background-position: center;
            position: relative;
        }

        .auth-layout::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(10, 10, 15, 0.85);
        }

        .auth-card {
            width: 100%;
            max-width: 450px;
            padding: 40px;
            position: relative;
            z-index: 10;
            text-align: center;
        }

        .form-group {
            margin-bottom: 20px;
            position: relative;
            text-align: left;
        }

        .form-control {
            width: 100%;
            padding: 15px 45px 15px 20px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            color: #fff;
            font-family: var(--font-main);
            transition: all 0.3s;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--orange);
            background: rgba(255, 255, 255, 0.1);
        }

        .input-icon {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-secondary);
            cursor: pointer;
        }
    </style>
</head>

<body>
    <div class="auth-layout">
        <div class="auth-card glass-card">
            <h2 class="heading-2">Reconfigure Password</h2>
            <p style="color: var(--text-secondary); margin: 15px 0 30px;">Initialize a new security key for your
                account.</p>

            <form action="login.html">
                <div class="form-group">
                    <label
                        style="color: var(--text-secondary); font-size: 0.9rem; margin-bottom: 5px; display: block;">New
                        Password</label>
                    <input type="password" id="new-pw" class="form-control" required>
                    <i class="fa-regular fa-eye input-icon" onclick="togglePw('new-pw')"></i>
                </div>
                <div class="form-group">
                    <label
                        style="color: var(--text-secondary); font-size: 0.9rem; margin-bottom: 5px; display: block;">Confirm
                        New Password</label>
                    <input type="password" id="conf-pw" class="form-control" required>
                    <i class="fa-regular fa-eye input-icon" onclick="togglePw('conf-pw')"></i>
                </div>

                <button type="submit" class="btn btn-primary"
                    style="width: 100%; border-radius: 12px; padding: 15px; background: linear-gradient(45deg, var(--orange), var(--pink));">Confirm
                    Changes</button>
            </form>
        </div>
    </div>
    <script>
        function togglePw(id) {
            const el = document.getElementById(id);
            if (el.type === 'password') {
                el.type = 'text';
            } else {
                el.type = 'password';
            }
        }
    </script>
</body>

</html>
