<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Categories | MartVerse</title>
    <link rel="stylesheet" href="css/globals.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .page-header {
            text-align: center;
            margin: 120px 0 60px 0;
        }

        .categories-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 30px;
            margin-bottom: 80px;
        }

        .category-card {
            position: relative;
            height: 250px;
            border-radius: 20px;
            overflow: hidden;
            display: flex;
            align-items: flex-end;
            text-decoration: none;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            transition: transform 0.4s ease, box-shadow 0.4s ease;
        }

        .category-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to top, rgba(0, 0, 0, 0.9) 0%, transparent 60%);
            z-index: 1;
        }

        .category-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 20px 40px rgba(15, 240, 252, 0.3);
        }

        .category-img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.6s ease;
        }

        .category-card:hover .category-img {
            transform: scale(1.1);
        }

        .category-content {
            position: relative;
            z-index: 2;
            padding: 25px;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .category-title {
            font-size: 1.5rem;
            font-weight: 700;
            color: #fff;
            margin: 0;
        }

        .category-count {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(5px);
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            color: var(--cyan);
            border: 1px solid var(--glass-border);
        }
    </style>
</head>

<body>
    <nav class="navbar glass">
        <!-- navbar same as others -->
        <div class="container nav-container">
            <a href="index.html" class="nav-logo text-gradient">MartVerse</a>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="categories.html" style="color: var(--electric-blue);">Categories</a></li>
                <li><a href="deals.html">Deals</a></li>
                <li><a href="products.html">Store</a></li>
            </ul>
        </div>
    </nav>

    <main class="container">
        <div class="page-header">
            <h1 class="heading-1">Explore By <span class="text-gradient">Category</span></h1>
            <p style="color: var(--text-secondary); margin-top: 15px; font-size: 1.1rem;">Dive into thousands of premium
                products across multiple universes.</p>
        </div>

        <div class="categories-grid">
            <a href="products.html?cat=electronics" class="category-card">
                <img src="https://images.unsplash.com/photo-1498049794561-7780e7231661?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80"
                    alt="Electronics" class="category-img">
                <div class="category-content">
                    <h3 class="category-title">Electronics</h3>
                    <span class="category-count">1.2k Items</span>
                </div>
            </a>
            <a href="products.html?cat=fashion" class="category-card">
                <img src="https://images.unsplash.com/photo-1445205170230-053b83016050?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80"
                    alt="Fashion" class="category-img">
                <div class="category-content">
                    <h3 class="category-title">Fashion</h3>
                    <span class="category-count">850 Items</span>
                </div>
            </a>
            <!-- Repeating similar cards for Grocery, Home, etc -->
            <a href="products.html?cat=furniture" class="category-card">
                <img src="https://images.unsplash.com/photo-1555041469-a586c61ea9bc?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80"
                    alt="Furniture" class="category-img">
                <div class="category-content">
                    <h3 class="category-title">Furniture</h3>
                    <span class="category-count">340 Items</span>
                </div>
            </a>
            <a href="products.html?cat=automotive" class="category-card">
                <img src="https://images.unsplash.com/photo-1542282088-fe8426682b8f?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80"
                    alt="Automotive" class="category-img">
                <div class="category-content">
                    <h3 class="category-title">Automotive</h3>
                    <span class="category-count">190 Items</span>
                </div>
            </a>
            <a href="products.html?cat=beauty" class="category-card">
                <img src="https://images.unsplash.com/photo-1596462502278-27bf85033e5a?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80"
                    alt="Beauty" class="category-img">
                <div class="category-content">
                    <h3 class="category-title">Beauty</h3>
                    <span class="category-count">560 Items</span>
                </div>
            </a>
            <a href="products.html?cat=sports" class="category-card">
                <img src="https://images.unsplash.com/photo-1517649763962-0c623066013b?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80"
                    alt="Sports" class="category-img">
                <div class="category-content">
                    <h3 class="category-title">Sports</h3>
                    <span class="category-count">420 Items</span>
                </div>
            </a>
        </div>
    </main>
</body>

</html>
